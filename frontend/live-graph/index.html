<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>brot.ai - Live Graph Visualization</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- D3.js v7 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-content">
        <div class="header-left">
          <div class="live-buttons">
            <button class="btn-success" id="start-live-session">start live session</button>
            <button class="btn-danger" id="stop-live-session" disabled>stop session</button>
          </div>
          <div class="status-indicator" style="margin-left: 12px;">
            <span class="status-dot" id="live-status-dot"></span>
            <span id="live-status-text">not connected</span>
          </div>
        </div>
        <div class="logo">brot.ai</div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Transcript Panel -->
      <div class="transcript-container-panel">
        <div class="transcript-header-wrapper">
          <div id="transcript-header-container"></div>
        </div>
        <div class="transcript-panel">
          <div id="transcript-display"></div>
        </div>
      </div>

      <!-- Graph Panel -->
      <div class="graph-container-panel">
        <div class="graph-controls">
          <div class="graph-info">
            <strong>version:</strong> <span id="graph-version">-</span> |
            <strong>nodes:</strong> <span id="node-count">0</span> |
            <strong>edges:</strong> <span id="edge-count">0</span>
          </div>
        </div>
        <div class="graph-container">
          <div id="graph-canvas"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Load components -->
  <script src="js/graph-renderer.js"></script>
  <script src="js/transcript-display.js"></script>
  <script src="js/session-manager.js"></script>
  <script src="test-data/mock-updates.js"></script>

  <!-- Main application script -->
  <script>
    // Initialize components
    let graphRenderer;
    let transcriptDisplay;
    let sessionManager;
    let mockUpdateInterval;
    let currentMockIndex = 0;
    let currentMode = 'test';  // 'test' or 'live'

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      // Create graph renderer - size dynamically to container
      const graphContainer = document.getElementById('graph-canvas');
      const getGraphSize = () => {
        if (graphContainer) {
          const rect = graphContainer.getBoundingClientRect();
          return { width: rect.width || 800, height: rect.height || 600 };
        }
        return { width: 800, height: 600 };
      };
      
      const size = getGraphSize();
      graphRenderer = new GraphRenderer('graph-canvas', {
        width: size.width,
        height: size.height,
        nodeRadiusScale: [8, 35],
        edgeWidthScale: [2, 6]
      });

      // Create transcript display
      transcriptDisplay = new TranscriptDisplay('transcript-display', {
        maxChunks: 100,
        autoScroll: true
      });

      console.log('✅ Components initialized');

      // Set up event listeners
      setupEventListeners();
      setupLiveModeListeners();
    });

    /**
     * Set up event listeners for controls
     */
    function setupEventListeners() {
      // Test 1: Load static graph
      const testStaticBtn = document.getElementById('test-static');
      if (testStaticBtn) {
        testStaticBtn.addEventListener('click', loadStaticGraph);
      }

      // Test 2: Start mock updates
      const testMockBtn = document.getElementById('test-mock');
      if (testMockBtn) {
        testMockBtn.addEventListener('click', startMockUpdates);
      }

      // Stop mock updates
      const stopMockBtn = document.getElementById('stop-mock');
      if (stopMockBtn) {
        stopMockBtn.addEventListener('click', stopMockUpdates);
      }

      // Clear all
      const clearAllBtn = document.getElementById('clear-all');
      if (clearAllBtn) {
        clearAllBtn.addEventListener('click', clearAll);
      }

    }

    /**
     * Test 1: Load static graph from JSON
     */
    async function loadStaticGraph() {
      try {
        console.log('Loading static graph...');
        console.log('📂 Loading static graph...');

        // Fetch static graph JSON
        const response = await fetch('test-data/static-graph.json');
        if (!response.ok) {
          throw new Error(`Failed to load: ${response.statusText}`);
        }

        const graphData = await response.json();
        console.log('✅ Static graph loaded:', graphData);

        // Update graph
        graphRenderer.updateGraph(graphData);
        updateGraphInfo(graphData);

        // Update transcript with sample text
        transcriptDisplay.clear();
        transcriptDisplay.addChunk({
          text: "Okay, so let's talk about the mobile app redesign. I think we really need to focus on user experience, especially for first-time users. The onboarding flow is confusing right now.",
          speaker: "Speaker 1",
          timestamp: graphData.timestamp,
          chunk_id: 0
        });

        console.log('Static graph loaded');
        console.log('✅ Static graph test complete');

      } catch (error) {
        console.error('❌ Failed to load static graph:', error);
        alert(`Failed to load static graph: ${error.message}`);
        console.error('Error loading static graph');
      }
    }

    /**
     * Test 2: Start mock updates (simulated SSE)
     */
    function startMockUpdates() {
      // Clear any existing interval
      if (mockUpdateInterval) {
        clearInterval(mockUpdateInterval);
      }

      // Reset state
      currentMockIndex = 0;
      graphRenderer.clear();
      transcriptDisplay.clear();
      updateGraphInfo({ version: 0, nodes: [], edges: [] });

      console.log('🚀 Starting mock updates...');
      console.log('Mock updates running');

      // Enable/disable buttons
      document.getElementById('test-mock').disabled = true;
      document.getElementById('stop-mock').disabled = false;
      document.getElementById('test-static').disabled = true;

      // Process first update immediately
      processMockUpdate();

      // Then continue every 3 seconds
      mockUpdateInterval = setInterval(() => {
        if (currentMockIndex < mockUpdates.length) {
          processMockUpdate();
        } else {
          // All updates processed
          stopMockUpdates();
          console.log('Mock updates complete');
          console.log('✅ All mock updates processed');
        }
      }, 3000);
    }

    /**
     * Process a single mock update
     */
    function processMockUpdate() {
      if (currentMockIndex >= mockUpdates.length) {
        return;
      }

      const update = mockUpdates[currentMockIndex];
      console.log(`📨 Processing update ${currentMockIndex + 1}/${mockUpdates.length}`);

      // Update graph
      graphRenderer.updateGraph(update.graph);
      updateGraphInfo(update.graph);

      // Add transcript chunk
      transcriptDisplay.addChunk({
        text: update.transcript.text,
        speaker: update.transcript.speaker,
        timestamp: update.timestamp,
        chunk_id: update.chunk_id
      });

      currentMockIndex++;
    }

    /**
     * Stop mock updates
     */
    function stopMockUpdates() {
      if (mockUpdateInterval) {
        clearInterval(mockUpdateInterval);
        mockUpdateInterval = null;
      }

      console.log('⏹️  Mock updates stopped');
      console.log('Mock updates stopped');

      // Re-enable buttons
      document.getElementById('test-mock').disabled = false;
      document.getElementById('stop-mock').disabled = true;
      document.getElementById('test-static').disabled = false;
    }

    /**
     * Clear all data
     */
    function clearAll() {
      console.log('🗑️  Clearing all data');

      // Stop mock updates if running
      if (mockUpdateInterval) {
        stopMockUpdates();
      }

      // Clear components
      graphRenderer.clear();
      transcriptDisplay.clear();
      updateGraphInfo({ version: 0, nodes: [], edges: [] });

      console.log('All data cleared');
      console.log('✅ All data cleared');
    }

    /**
     * Update graph info display
     */
    function updateGraphInfo(graphData) {
      document.getElementById('graph-version').textContent = graphData.version || '-';
      document.getElementById('node-count').textContent = graphData.nodes?.length || 0;
      document.getElementById('edge-count').textContent = graphData.edges?.length || 0;
    }

    /**
     * Update status indicator (deprecated - using live status indicator now)
     */
    function updateStatus(text, active) {
      // This function is deprecated - status elements were removed
      console.log('Status update (deprecated):', text, active);
    }

    /**
     * Update live status indicator
     */
    function updateLiveStatus(text, active) {
      document.getElementById('live-status-text').textContent = text;
      const dot = document.getElementById('live-status-dot');

      if (active) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    }

    /**
     * Set up live mode event listeners
     */
    function setupLiveModeListeners() {
      // Session controls
      const startBtn = document.getElementById('start-live-session');
      const stopBtn = document.getElementById('stop-live-session');
      
      if (startBtn) {
        console.log('✅ Setting up start-live-session listener', startBtn);
        startBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          console.log('🔵 start-live-session button clicked!');
          try {
            if (typeof startLiveSession === 'function') {
              console.log('✅ Calling startLiveSession function...');
              startLiveSession();
            } else {
              console.error('❌ startLiveSession function not found!', typeof startLiveSession);
            }
          } catch (error) {
            console.error('❌ Error in start-live-session click handler:', error);
          }
        });
      } else {
        console.error('❌ start-live-session button not found!');
      }
      
      if (stopBtn) {
        stopBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (typeof stopLiveSession === 'function') {
            stopLiveSession();
          }
        });
      }
    }

    /**
     * Switch between test and live mode (deprecated - mode tabs removed)
     */
    function switchMode(mode) {
      currentMode = mode;
      console.log(`Mode set to ${mode}`);
    }

    // Orchestrator URL - hardcoded since input field removed
    const ORCHESTRATOR_URL = 'http://localhost:8003';

    /**
     * Get orchestrator URL (returns hardcoded value)
     */
    function getOrchestratorUrl() {
      return ORCHESTRATOR_URL;
    }

    /**
     * Check orchestrator health
     */
    async function checkOrchestratorHealth() {
      try {
        const url = getOrchestratorUrl();
        updateLiveStatus('checking health...', false);

        const response = await fetch(`${url}/health`);
        if (!response.ok) {
          throw new Error(`Health check failed: ${response.status}`);
        }

        const health = await response.json();
        console.log('Orchestrator health:', health);

        updateLiveStatus(`healthy: ${health.status}`, false);
        alert(`Orchestrator is ${health.status}\n\nDependencies:\n- STT: ${health.dependencies.speech_to_text.healthy ? '✅' : '❌'}\n- Graph: ${health.dependencies.graph_generation.healthy ? '✅' : '❌'}`);

      } catch (error) {
        console.error('Health check failed:', error);
        updateLiveStatus('health check failed', false);
        alert(`Failed to connect to orchestrator:\n${error.message}\n\nMake sure:\n1. Orchestrator is running (port 8003)\n2. STT service is running (port 8005)\n3. Graph service is running (port 8002)`);
      }
    }

    /**
     * Start live session
     */
    async function startLiveSession() {
      console.log('🚀 startLiveSession() called');
      try {
        const url = getOrchestratorUrl();
        console.log('📍 Orchestrator URL:', url);
        updateLiveStatus('starting session...', true);
        console.log('✅ Status updated to "starting session..."');

        // Clear previous graph/transcript
        console.log('🧹 Clearing previous graph/transcript...');
        graphRenderer.clear();
        transcriptDisplay.clear();
        updateGraphInfo({ version: 0, nodes: [], edges: [] });

        // Check if SessionManager is available
        if (typeof SessionManager === 'undefined') {
          throw new Error('SessionManager is not loaded. Check if session-manager.js is loaded correctly.');
        }
        console.log('✅ SessionManager is available');

        // Create session manager if not exists
        if (!sessionManager || sessionManager.orchestratorUrl !== url) {
          console.log('📦 Creating new SessionManager...');
          sessionManager = new SessionManager(url, {
            onUpdate: (data) => {
              console.log('📨 Received SSE update:', data);

              // Update graph
              if (data.graph) {
                graphRenderer.updateGraph(data.graph);
                updateGraphInfo(data.graph);
              }

              // Add transcript
              if (data.transcript) {
                transcriptDisplay.addChunk({
                  text: data.transcript.text,
                  speaker: data.transcript.speaker || 'Speaker',
                  timestamp: data.timestamp,
                  chunk_id: data.chunk_id
                });
              }
            },
            onError: (error) => {
              console.error('SessionManager error:', error);
              updateLiveStatus(`error: ${error.message}`, false);
            },
            onConnect: () => {
              console.log('✅ Connected to SSE stream');
              updateLiveStatus('connected - receiving updates', true);
            },
            onDisconnect: () => {
              console.log('Disconnected from SSE stream');
              updateLiveStatus('disconnected', false);
            },
            onStatusChange: (state, message) => {
              // Keep indicator active during 'stopping' state (grace period)
              const isActive = state === 'active' || state === 'stopping';
              updateLiveStatus(message, isActive);
            }
          });
          console.log('✅ SessionManager created');
        } else {
          console.log('✅ Using existing SessionManager');
        }

        // Start session
        console.log('🎬 Calling sessionManager.startSession()...');
        const sessionData = await sessionManager.startSession();
        console.log('✅ Session started, data received:', sessionData);

        // Update UI
        const sessionDisplay = document.getElementById('session-id-display');
        if (sessionDisplay) {
          sessionDisplay.textContent = `Session: ${sessionData.session_id}`;
        }
        document.getElementById('start-live-session').disabled = true;
        document.getElementById('stop-live-session').disabled = false;

        console.log('✅ Live session started:', sessionData);

      } catch (error) {
        console.error('Failed to start live session:', error);
        updateLiveStatus(`failed: ${error.message}`, false);
        alert(`Failed to start session:\n${error.message}`);
      }
    }

    /**
     * Stop live session with grace period
     */
    async function stopLiveSession() {
      try {
        if (!sessionManager) {
          console.warn('No active session manager');
          return;
        }

        // Disable stop button during grace period
        document.getElementById('stop-live-session').disabled = true;

        console.log('🛑 Stop requested - entering grace period for final updates...');

        // Keep status indicator active during grace period (still receiving updates)
        // The status text will be updated by SessionManager's onStatusChange callback

        const finalState = await sessionManager.stopSession();
        console.log('✅ Session stopped:', finalState);

        // Update UI
        const sessionDisplay = document.getElementById('session-id-display');
        if (sessionDisplay) {
          sessionDisplay.textContent = '';
        }
        document.getElementById('start-live-session').disabled = false;
        document.getElementById('stop-live-session').disabled = true;

        updateLiveStatus('session stopped', false);

        // Show final summary
        if (finalState && finalState.summary) {
          const message = `Session stopped successfully!\n\n` +
            `Final Summary:\n` +
            `─────────────────────────\n` +
            `📝 Transcript chunks: ${finalState.summary.chunk_count}\n` +
            `🔢 Graph version: ${finalState.summary.graph_version}\n` +
            `📊 Graph updates: ${finalState.summary.total_graph_updates}\n` +
            `📏 Transcript length: ${finalState.summary.transcript_length} characters\n` +
            `\n💾 Saved to: ${finalState.saved_to || 'sessions directory'}`;

          alert(message);
        }

      } catch (error) {
        console.error('Failed to stop session:', error);
        updateLiveStatus(`error: ${error.message}`, false);

        // Re-enable buttons on error
        document.getElementById('start-live-session').disabled = false;
        document.getElementById('stop-live-session').disabled = true;

        alert(`Failed to stop session:\n${error.message}`);
      }
    }

    /**
     * Get current session state
     */
    async function getSessionState() {
      try {
        if (!sessionManager) {
          alert('No active session');
          return;
        }

        const state = await sessionManager.getSessionState();
        console.log('Current session state:', state);

        alert(`Session State:\n\nID: ${state.session_id}\nStatus: ${state.status}\nNodes: ${state.graph?.nodes?.length || 0}\nEdges: ${state.graph?.edges?.length || 0}\nChunks: ${state.chunk_count}\nTranscript length: ${state.full_transcript?.length || 0} chars`);

      } catch (error) {
        console.error('Failed to get session state:', error);
        alert(`Failed to get session state:\n${error.message}`);
      }
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      const container = document.getElementById('graph-canvas');
      if (container && graphRenderer) {
        const rect = container.getBoundingClientRect();
        // Resize with minimum dimensions
        const width = Math.max(rect.width, 1200);
        const height = Math.max(rect.height, 700);
        graphRenderer.resize(width, height);
      }
    });
  </script>
</body>
</html>
