<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Graph Visualization - Brainstorm Tool</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- D3.js v7 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>Live Graph Visualization</h1>
      <p>Real-time knowledge graph from speech transcription</p>
    </header>

    <!-- Mode Selector -->
    <div class="mode-selector">
      <button class="mode-tab active" id="tab-test">Test Mode</button>
      <button class="mode-tab" id="tab-live">Live Mode (Orchestrator)</button>
    </div>

    <!-- Test Controls -->
    <div class="test-controls" id="test-mode-panel">
      <h4>Test Mode Controls</h4>
      <div class="test-buttons">
        <button class="btn-primary" id="test-static">Test 1: Load Static Graph</button>
        <button class="btn-success" id="test-mock">Test 2: Start Mock Updates</button>
        <button class="btn-warning" id="stop-mock" disabled>Stop Mock Updates</button>
        <button class="btn-danger" id="clear-all">Clear All</button>
      </div>
      <div style="margin-top: 10px;">
        <span class="status-indicator">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Ready</span>
        </span>
      </div>
    </div>

    <!-- Live Mode Controls -->
    <div class="live-controls" id="live-mode-panel" style="display: none;">
      <h4>Live Mode - Real Orchestrator Connection</h4>
      <div class="config-section">
        <label for="orchestrator-url">Orchestrator URL:</label>
        <input type="text" id="orchestrator-url" value="http://localhost:8003" style="width: 300px; padding: 6px; margin-left: 10px;">
        <button class="btn-secondary" id="check-health">Check Health</button>
      </div>
      <div class="live-buttons" style="margin-top: 15px;">
        <button class="btn-success" id="start-live-session">Start Live Session</button>
        <button class="btn-warning" id="pause-live-session" disabled>Pause Session</button>
        <button class="btn-success" id="resume-live-session" disabled style="display: none;">Resume Session</button>
        <button class="btn-danger" id="stop-live-session" disabled>Stop Session</button>
        <button class="btn-secondary" id="get-session-state" disabled>Get State</button>
      </div>
      <div style="margin-top: 10px;">
        <span class="status-indicator">
          <span class="status-dot" id="live-status-dot"></span>
          <span id="live-status-text">Not connected</span>
        </span>
        <span id="session-id-display" style="margin-left: 15px; font-size: 13px; color: #666;"></span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Transcript Panel -->
      <div class="transcript-panel">
        <div id="transcript-display"></div>
      </div>

      <!-- Graph Panel -->
      <div class="graph-panel">
        <div class="graph-controls">
          <div class="graph-info">
            <strong>Version:</strong> <span id="graph-version">-</span> |
            <strong>Nodes:</strong> <span id="node-count">0</span> |
            <strong>Edges:</strong> <span id="edge-count">0</span>
          </div>
          <div class="control-buttons">
            <button class="btn-secondary" id="debug-edges">Debug Edges</button>
            <button class="btn-secondary" id="reset-zoom">Reset Zoom</button>
          </div>
        </div>
        <div class="graph-container">
          <div id="graph-canvas"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Load components -->
  <script src="js/graph-renderer.js"></script>
  <script src="js/transcript-display.js"></script>
  <script src="js/session-manager.js"></script>
  <script src="test-data/mock-updates.js"></script>

  <!-- Main application script -->
  <script>
    // Initialize components
    let graphRenderer;
    let transcriptDisplay;
    let sessionManager;
    let mockUpdateInterval;
    let currentMockIndex = 0;
    let currentMode = 'test';  // 'test' or 'live'

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      // Create graph renderer
      graphRenderer = new GraphRenderer('graph-canvas', {
        width: 1200,
        height: 800,
        nodeRadiusScale: [8, 35],
        edgeWidthScale: [2, 6]  // Increased from [1, 5] for better visibility
      });

      // Create transcript display
      transcriptDisplay = new TranscriptDisplay('transcript-display', {
        maxChunks: 100,
        autoScroll: true
      });

      console.log('✅ Components initialized');
      updateStatus('Ready', false);

      // Set up event listeners
      setupEventListeners();
      setupLiveModeListeners();
    });

    /**
     * Set up event listeners for controls
     */
    function setupEventListeners() {
      // Test 1: Load static graph
      document.getElementById('test-static').addEventListener('click', loadStaticGraph);

      // Test 2: Start mock updates
      document.getElementById('test-mock').addEventListener('click', startMockUpdates);

      // Stop mock updates
      document.getElementById('stop-mock').addEventListener('click', stopMockUpdates);

      // Clear all
      document.getElementById('clear-all').addEventListener('click', clearAll);

      // Debug edges
      document.getElementById('debug-edges').addEventListener('click', () => {
        const edges = document.querySelectorAll('.links line');
        console.log('=== EDGE DEBUG ===');
        console.log(`Total edges in DOM: ${edges.length}`);
        edges.forEach((edge, i) => {
          console.log(`Edge ${i}:`, {
            x1: edge.getAttribute('x1'),
            y1: edge.getAttribute('y1'),
            x2: edge.getAttribute('x2'),
            y2: edge.getAttribute('y2'),
            stroke: edge.getAttribute('stroke'),
            strokeWidth: edge.getAttribute('stroke-width'),
            opacity: edge.style.opacity
          });
        });
        console.log('Graph data edges:', graphRenderer.edges);
      });

      // Reset zoom
      document.getElementById('reset-zoom').addEventListener('click', () => {
        // Re-initialize graph (resets zoom/pan)
        const stats = graphRenderer.getStats();
        if (stats.nodeCount > 0) {
          graphRenderer.simulation.alpha(0.3).restart();
        }
      });
    }

    /**
     * Test 1: Load static graph from JSON
     */
    async function loadStaticGraph() {
      try {
        updateStatus('Loading static graph...', true);
        console.log('📂 Loading static graph...');

        // Fetch static graph JSON
        const response = await fetch('test-data/static-graph.json');
        if (!response.ok) {
          throw new Error(`Failed to load: ${response.statusText}`);
        }

        const graphData = await response.json();
        console.log('✅ Static graph loaded:', graphData);

        // Update graph
        graphRenderer.updateGraph(graphData);
        updateGraphInfo(graphData);

        // Update transcript with sample text
        transcriptDisplay.clear();
        transcriptDisplay.addChunk({
          text: "Okay, so let's talk about the mobile app redesign. I think we really need to focus on user experience, especially for first-time users. The onboarding flow is confusing right now.",
          speaker: "Speaker 1",
          timestamp: graphData.timestamp,
          chunk_id: 0
        });

        updateStatus('Static graph loaded', false);
        console.log('✅ Static graph test complete');

      } catch (error) {
        console.error('❌ Failed to load static graph:', error);
        alert(`Failed to load static graph: ${error.message}`);
        updateStatus('Error', false);
      }
    }

    /**
     * Test 2: Start mock updates (simulated SSE)
     */
    function startMockUpdates() {
      // Clear any existing interval
      if (mockUpdateInterval) {
        clearInterval(mockUpdateInterval);
      }

      // Reset state
      currentMockIndex = 0;
      graphRenderer.clear();
      transcriptDisplay.clear();
      updateGraphInfo({ version: 0, nodes: [], edges: [] });

      console.log('🚀 Starting mock updates...');
      updateStatus('Mock updates running', true);

      // Enable/disable buttons
      document.getElementById('test-mock').disabled = true;
      document.getElementById('stop-mock').disabled = false;
      document.getElementById('test-static').disabled = true;

      // Process first update immediately
      processMockUpdate();

      // Then continue every 3 seconds
      mockUpdateInterval = setInterval(() => {
        if (currentMockIndex < mockUpdates.length) {
          processMockUpdate();
        } else {
          // All updates processed
          stopMockUpdates();
          updateStatus('Mock updates complete', false);
          console.log('✅ All mock updates processed');
        }
      }, 3000);
    }

    /**
     * Process a single mock update
     */
    function processMockUpdate() {
      if (currentMockIndex >= mockUpdates.length) {
        return;
      }

      const update = mockUpdates[currentMockIndex];
      console.log(`📨 Processing update ${currentMockIndex + 1}/${mockUpdates.length}`);

      // Update graph
      graphRenderer.updateGraph(update.graph);
      updateGraphInfo(update.graph);

      // Add transcript chunk
      transcriptDisplay.addChunk({
        text: update.transcript.text,
        speaker: update.transcript.speaker,
        timestamp: update.timestamp,
        chunk_id: update.chunk_id
      });

      currentMockIndex++;
    }

    /**
     * Stop mock updates
     */
    function stopMockUpdates() {
      if (mockUpdateInterval) {
        clearInterval(mockUpdateInterval);
        mockUpdateInterval = null;
      }

      console.log('⏹️  Mock updates stopped');
      updateStatus('Stopped', false);

      // Re-enable buttons
      document.getElementById('test-mock').disabled = false;
      document.getElementById('stop-mock').disabled = true;
      document.getElementById('test-static').disabled = false;
    }

    /**
     * Clear all data
     */
    function clearAll() {
      console.log('🗑️  Clearing all data');

      // Stop mock updates if running
      if (mockUpdateInterval) {
        stopMockUpdates();
      }

      // Clear components
      graphRenderer.clear();
      transcriptDisplay.clear();
      updateGraphInfo({ version: 0, nodes: [], edges: [] });

      updateStatus('Ready', false);
      console.log('✅ All data cleared');
    }

    /**
     * Update graph info display
     */
    function updateGraphInfo(graphData) {
      document.getElementById('graph-version').textContent = graphData.version || '-';
      document.getElementById('node-count').textContent = graphData.nodes?.length || 0;
      document.getElementById('edge-count').textContent = graphData.edges?.length || 0;
    }

    /**
     * Update status indicator
     */
    function updateStatus(text, active) {
      document.getElementById('status-text').textContent = text;
      const dot = document.getElementById('status-dot');

      if (active) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    }

    /**
     * Update live status indicator
     */
    function updateLiveStatus(text, active) {
      document.getElementById('live-status-text').textContent = text;
      const dot = document.getElementById('live-status-dot');

      if (active) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    }

    /**
     * Set up live mode event listeners
     */
    function setupLiveModeListeners() {
      // Mode tabs
      document.getElementById('tab-test').addEventListener('click', () => switchMode('test'));
      document.getElementById('tab-live').addEventListener('click', () => switchMode('live'));

      // Health check
      document.getElementById('check-health').addEventListener('click', checkOrchestratorHealth);

      // Session controls
      document.getElementById('start-live-session').addEventListener('click', startLiveSession);
      document.getElementById('pause-live-session').addEventListener('click', pauseLiveSession);
      document.getElementById('resume-live-session').addEventListener('click', resumeLiveSession);
      document.getElementById('stop-live-session').addEventListener('click', stopLiveSession);
      document.getElementById('get-session-state').addEventListener('click', getSessionState);
    }

    /**
     * Switch between test and live mode
     */
    function switchMode(mode) {
      currentMode = mode;

      // Update tabs
      document.getElementById('tab-test').classList.toggle('active', mode === 'test');
      document.getElementById('tab-live').classList.toggle('active', mode === 'live');

      // Show/hide panels
      document.getElementById('test-mode-panel').style.display = mode === 'test' ? 'block' : 'none';
      document.getElementById('live-mode-panel').style.display = mode === 'live' ? 'block' : 'none';

      console.log(`Switched to ${mode} mode`);
    }

    /**
     * Check orchestrator health
     */
    async function checkOrchestratorHealth() {
      try {
        const url = document.getElementById('orchestrator-url').value;
        updateLiveStatus('Checking health...', false);

        const response = await fetch(`${url}/health`);
        if (!response.ok) {
          throw new Error(`Health check failed: ${response.status}`);
        }

        const health = await response.json();
        console.log('Orchestrator health:', health);

        updateLiveStatus(`Healthy: ${health.status}`, false);
        alert(`Orchestrator is ${health.status}\n\nDependencies:\n- STT: ${health.dependencies.speech_to_text.healthy ? '✅' : '❌'}\n- Graph: ${health.dependencies.graph_generation.healthy ? '✅' : '❌'}`);

      } catch (error) {
        console.error('Health check failed:', error);
        updateLiveStatus('Health check failed', false);
        alert(`Failed to connect to orchestrator:\n${error.message}\n\nMake sure:\n1. Orchestrator is running (port 8003)\n2. STT service is running (port 8005)\n3. Graph service is running (port 8002)`);
      }
    }

    /**
     * Start live session
     */
    async function startLiveSession() {
      try {
        const url = document.getElementById('orchestrator-url').value;
        updateLiveStatus('Starting session...', true);

        // Clear previous graph/transcript
        graphRenderer.clear();
        transcriptDisplay.clear();
        updateGraphInfo({ version: 0, nodes: [], edges: [] });

        // Create session manager if not exists
        if (!sessionManager || sessionManager.orchestratorUrl !== url) {
          sessionManager = new SessionManager(url, {
            onUpdate: (data) => {
              console.log('📨 Received SSE update:', data);

              // Update graph
              if (data.graph) {
                graphRenderer.updateGraph(data.graph);
                updateGraphInfo(data.graph);
              }

              // Add transcript
              if (data.transcript) {
                transcriptDisplay.addChunk({
                  text: data.transcript.text,
                  speaker: data.transcript.speaker || 'Speaker',
                  timestamp: data.timestamp,
                  chunk_id: data.chunk_id
                });
              }
            },
            onError: (error) => {
              console.error('SessionManager error:', error);
              updateLiveStatus(`Error: ${error.message}`, false);
            },
            onConnect: () => {
              console.log('✅ Connected to SSE stream');
              updateLiveStatus('Connected - receiving updates', true);
            },
            onDisconnect: () => {
              console.log('Disconnected from SSE stream');
              updateLiveStatus('Disconnected', false);
            },
            onStatusChange: (state, message) => {
              // Keep indicator active during 'active', 'stopping', and 'resuming' states
              const isActive = state === 'active' || state === 'stopping' || state === 'resuming';
              updateLiveStatus(message, isActive);
            }
          });
        }

        // Start session
        const sessionData = await sessionManager.startSession();

        // Update UI
        document.getElementById('session-id-display').textContent = `Session: ${sessionData.session_id}`;
        document.getElementById('start-live-session').disabled = true;
        document.getElementById('pause-live-session').disabled = false;
        document.getElementById('pause-live-session').style.display = 'inline-block';
        document.getElementById('resume-live-session').disabled = true;
        document.getElementById('resume-live-session').style.display = 'none';
        document.getElementById('stop-live-session').disabled = false;
        document.getElementById('get-session-state').disabled = false;

        console.log('✅ Live session started:', sessionData);

      } catch (error) {
        console.error('Failed to start live session:', error);
        updateLiveStatus(`Failed: ${error.message}`, false);
        alert(`Failed to start session:\n${error.message}`);
      }
    }

    /**
     * Pause live session
     */
    async function pauseLiveSession() {
      try {
        if (!sessionManager) {
          console.warn('No active session manager');
          return;
        }

        console.log('⏸️  Pausing session...');

        const pausedData = await sessionManager.pauseSession();
        console.log('✅ Session paused:', pausedData);

        // Update UI - hide pause, show resume
        document.getElementById('pause-live-session').style.display = 'none';
        document.getElementById('resume-live-session').disabled = false;
        document.getElementById('resume-live-session').style.display = 'inline-block';

        updateLiveStatus('Session paused - not capturing audio', false);

      } catch (error) {
        console.error('Failed to pause session:', error);
        updateLiveStatus(`Error: ${error.message}`, false);
        alert(`Failed to pause session:\n${error.message}`);
      }
    }

    /**
     * Resume paused session
     */
    async function resumeLiveSession() {
      try {
        if (!sessionManager) {
          console.warn('No active session manager');
          return;
        }

        console.log('▶️  Resuming session...');

        const resumedData = await sessionManager.resumeSession();
        console.log('✅ Session resumed:', resumedData);

        // Update UI - hide resume, show pause
        document.getElementById('resume-live-session').style.display = 'none';
        document.getElementById('pause-live-session').disabled = false;
        document.getElementById('pause-live-session').style.display = 'inline-block';

        updateLiveStatus('Session active - capturing audio', true);

      } catch (error) {
        console.error('Failed to resume session:', error);
        updateLiveStatus(`Error: ${error.message}`, false);
        alert(`Failed to resume session:\n${error.message}`);
      }
    }

    /**
     * Stop live session with grace period
     */
    async function stopLiveSession() {
      try {
        if (!sessionManager) {
          console.warn('No active session manager');
          return;
        }

        // Disable buttons during grace period
        document.getElementById('pause-live-session').disabled = true;
        document.getElementById('resume-live-session').disabled = true;
        document.getElementById('stop-live-session').disabled = true;
        document.getElementById('get-session-state').disabled = true;

        console.log('🛑 Stop requested - entering grace period for final updates...');

        // Keep status indicator active during grace period (still receiving updates)
        // The status text will be updated by SessionManager's onStatusChange callback

        const finalState = await sessionManager.stopSession();
        console.log('✅ Session stopped:', finalState);

        // Update UI
        document.getElementById('session-id-display').textContent = '';
        document.getElementById('start-live-session').disabled = false;
        document.getElementById('pause-live-session').disabled = true;
        document.getElementById('pause-live-session').style.display = 'inline-block';
        document.getElementById('resume-live-session').disabled = true;
        document.getElementById('resume-live-session').style.display = 'none';
        document.getElementById('stop-live-session').disabled = true;
        document.getElementById('get-session-state').disabled = true;

        updateLiveStatus('Session stopped', false);

        // Show final summary
        if (finalState && finalState.summary) {
          const message = `Session stopped successfully!\n\n` +
            `Final Summary:\n` +
            `─────────────────────────\n` +
            `📝 Transcript chunks: ${finalState.summary.chunk_count}\n` +
            `🔢 Graph version: ${finalState.summary.graph_version}\n` +
            `📊 Graph updates: ${finalState.summary.total_graph_updates}\n` +
            `📏 Transcript length: ${finalState.summary.transcript_length} characters\n` +
            `\n💾 Saved to: ${finalState.saved_to || 'sessions directory'}`;

          alert(message);
        }

      } catch (error) {
        console.error('Failed to stop session:', error);
        updateLiveStatus(`Error: ${error.message}`, false);

        // Re-enable buttons on error
        document.getElementById('start-live-session').disabled = false;
        document.getElementById('pause-live-session').disabled = true;
        document.getElementById('resume-live-session').disabled = true;
        document.getElementById('stop-live-session').disabled = true;

        alert(`Failed to stop session:\n${error.message}`);
      }
    }

    /**
     * Get current session state
     */
    async function getSessionState() {
      try {
        if (!sessionManager) {
          alert('No active session');
          return;
        }

        const state = await sessionManager.getSessionState();
        console.log('Current session state:', state);

        alert(`Session State:\n\nID: ${state.session_id}\nStatus: ${state.status}\nNodes: ${state.graph?.nodes?.length || 0}\nEdges: ${state.graph?.edges?.length || 0}\nChunks: ${state.chunk_count}\nTranscript length: ${state.full_transcript?.length || 0} chars`);

      } catch (error) {
        console.error('Failed to get session state:', error);
        alert(`Failed to get session state:\n${error.message}`);
      }
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      const container = document.getElementById('graph-canvas');
      if (container && graphRenderer) {
        const rect = container.getBoundingClientRect();
        graphRenderer.resize(rect.width, rect.height);
      }
    });
  </script>
</body>
</html>
